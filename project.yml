# XcodeGen 项目配置（运行 `xcodegen generate` 生成 FrameScoop.xcodeproj）
# 文档：https://github.com/yonaskolb/XcodeGen
name: FrameScoop
options:
  bundleIdPrefix: com.framescoop
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # 使用我们手写的 Info.plist，禁止 Xcode 自动生成
    GENERATE_INFOPLIST_FILE: NO
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  FrameScoop:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: FrameScoop
        excludes:
          - "Info.plist"
          - "FrameScoop.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.framescoop.app
        PRODUCT_NAME: FrameScoop
        INFOPLIST_FILE: FrameScoop/Info.plist
        CODE_SIGN_ENTITLEMENTS: FrameScoop/FrameScoop.entitlements
        # 启用 Hardened Runtime（公证必需）
        ENABLE_HARDENED_RUNTIME: YES
        # 未配置开发者账号时使用临时签名（ad-hoc），便于本地构建测试
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        # App 图标通过 FrameScoop/Resources/AppIcon.icns 打包，由 CFBundleIconFile 引用
        # （跨 SDK 稳定，避免 asset catalog 单尺寸图标兼容问题）
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
        DEAD_CODE_STRIPPING: YES
        # 支持通用二进制（Apple Silicon + Intel）
        ARCHS: "$(ARCHS_STANDARD)"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

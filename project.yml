# XcodeGen 项目配置（运行 `xcodegen generate` 生成 FrameScoop.xcodeproj）
# 文档：https://github.com/yonaskolb/XcodeGen
name: FrameScoop
options:
  bundleIdPrefix: com.framescoop
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.11"
    CURRENT_PROJECT_VERSION: "6"
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # 使用我们手写的 Info.plist，禁止 Xcode 自动生成
    GENERATE_INFOPLIST_FILE: NO
    DEVELOPMENT_TEAM: ""
    # Manual + 自签名证书：designated requirement 基于证书而非 cdhash，
    # 代码改动不再使 TCC（照片库等）授权失效，Xcode 调试也稳定。替代 ad-hoc。
    # 自签名证书不过期、不被撤销，比被撤销的 Apple Development 证书更可靠。
    CODE_SIGN_STYLE: Manual

targets:
  FrameScoop:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: FrameScoop
        excludes:
          - "Info.plist"
          - "FrameScoop.entitlements"
          # 完整 .icns 不参与资源拷贝：actool 会往同一路径写它那份截断版本，
          # 两者并存会让产物字节随干净/增量构建而变。改由下面的 postBuildScript
          # 在 actool 之后覆写，见该脚本注释。
          - "Resources/AppIcon.icns"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.framescoop.app
        PRODUCT_NAME: FrameScoop
        INFOPLIST_FILE: FrameScoop/Info.plist
        CODE_SIGN_ENTITLEMENTS: FrameScoop/FrameScoop.entitlements
        # Hardened Runtime 关闭（仅影响 Xcode 本地构建；直发包由 package_dmg.sh
        # 以 Developer ID 重签时必然开启硬运行，公证的硬性要求）。
        #
        # 2026-09-16 更正：此处原注释写「Apple Development 证书 + HR 会让照片库 TCC
        # 静默拒绝（2026-09-02 探针实测）」—— 那个结论**归错了因**。真实原因是
        # entitlements 里缺 com.apple.security.personal-information.photos-library：
        # 硬运行要求资源访问必须由 entitlement 显式声明，缺失才导致 requestAuthorization
        # 静默返回 .denied。同一权限项在纯沙盒下不声明也能工作，所以那次探针只看到
        # 「开了 HR 就坏」这个规律，把 HR 当成了元凶，于是关掉 HR 绕过去 —— 而 1.0.9
        # 直发版首次启用公证（因而必然开 HR），这个被绕过的坑就暴露了。
        # 权限项已补齐，此处保留 NO 只是维持本地调试现状；如需让本地构建与发布配置
        # 一致（更容易提前发现此类差异），可改为 YES。
        ENABLE_HARDENED_RUNTIME: NO
        # 关闭 Xcode 15 Debug Dylib Support：自签名证书无 TeamIdentifier，
        # 拆出的 FrameScoop.debug.dylib 与主二进制 Team ID 不匹配，dyld library
        # validation 拒绝加载 -> dyld abort -> SIGABRT。关掉后 Debug 直接编进主二进制。
        ENABLE_DEBUG_DYLIB: NO
        # 用自签名证书 "FrameScoop Dev" 签名（稳定身份，DR 锚定证书而非 cdhash）
        # 代码改动重签后 TCC（照片库等）授权保持有效，Xcode 调试稳定
        CODE_SIGN_IDENTITY: "FrameScoop Dev"
        CODE_SIGN_STYLE: Manual
        # App 图标来源：资源目录 FrameScoop/Assets.xcassets/AppIcon.appiconset
        # （由 Scripts/generate_icon.sh 从项目根 FC.png 生成）。
        #
        # **为什么必须用资源目录**（2026-09-26 实测）：App Store 的可见界面 ——
        # ASC 的「构建版本上传」列表、商店搜索结果 —— 只有资源目录 AppIcon 才渲染
        # 得出图标；只用手搓 .icns 时这些位置是**空白占位图**。
        # 实测：1.0.10 及其之前无资源目录的构建在 ASC 列表全是空白，
        # 加了资源目录的 1.0.11 build 3 是列表里唯一有图标的。
        #
        # **配套动作**：actool 还会在 bundle 内生成一份**截断的** AppIcon.icns
        # （仅 ic04/ic07/ic11/ic13，最大 256px）并把 CFBundleIconFile 指向它；
        # Apple 提取商店页美术（iconAssetToken）读的正是这份，会把美术从 1024 压到 256。
        # 试过两条绕法都失败：改名 → actool 仍覆写 CFBundleIconFile；
        # 不设 ASSETCATALOG_COMPILER_APPICON_NAME → 条目被整体排除出 Assets.car。
        # 即「图标可见」与「美术 1024」被 actool 绑成一体，无法用配置分开。
        # 解法见本 target 末尾的 postBuildScript：在**签名前**用完整 .icns 覆写它那份。
        # 详细验证方法见记忆 framescoop-icon-approach。
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
        DEAD_CODE_STRIPPING: YES
        # 支持通用二进制（Apple Silicon + Intel）
        ARCHS: "$(ARCHS_STANDARD)"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

    # actool 会把资源目录里的 AppIcon 编进 Assets.car（商店界面靠它显示图标），
    # 但**同时**导出一份截断的 AppIcon.icns（只有 4 个块、最大 256px）并写进
    # bundle，而 Apple 提取商店页美术（iconAssetToken）读的正是这份 —— 于是美术
    # 从 1024 掉到 256。
    #
    # 这里在其后覆写为 generate_icon.sh 产出的完整 .icns（11 个块，含 1024）。
    # 只改文件内容、不动 Info.plist：actool 已把 CFBundleIconFile 指向 AppIcon，
    # 而完整件的文件名同样是 AppIcon.icns，指针天然正确。
    #
    # 必须跑在代码签名**之前**，否则改 bundle 内容会让签名失效。
    # postBuildScripts 是阶段列表末尾的 Run Script，签名在其后，顺序成立。
    postBuildScripts:
      - name: 覆写为完整 AppIcon.icns
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          SRC="$SRCROOT/FrameScoop/Resources/AppIcon.icns"
          DST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/AppIcon.icns"
          if [ ! -f "$SRC" ]; then
            echo "error: 找不到完整图标 $SRC —— 先跑 bash Scripts/generate_icon.sh" >&2
            exit 1
          fi
          cp "$SRC" "$DST"
          echo "已覆写 AppIcon.icns 为完整版本（$(stat -f%z "$DST") 字节）"

  FrameScoopTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: FrameScoopTests
    dependencies:
      - target: FrameScoop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.framescoop.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  FrameScoop:
    build:
      targets:
        FrameScoop: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FrameScoopTests

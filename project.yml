# XcodeGen 项目配置（运行 `xcodegen generate` 生成 FrameScoop.xcodeproj）
# 文档：https://github.com/yonaskolb/XcodeGen
name: FrameScoop
options:
  bundleIdPrefix: com.framescoop
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.11"
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # 使用我们手写的 Info.plist，禁止 Xcode 自动生成
    GENERATE_INFOPLIST_FILE: NO
    DEVELOPMENT_TEAM: ""
    # Manual + 自签名证书：designated requirement 基于证书而非 cdhash，
    # 代码改动不再使 TCC（照片库等）授权失效，Xcode 调试也稳定。替代 ad-hoc。
    # 自签名证书不过期、不被撤销，比被撤销的 Apple Development 证书更可靠。
    CODE_SIGN_STYLE: Manual

targets:
  FrameScoop:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: FrameScoop
        excludes:
          - "Info.plist"
          - "FrameScoop.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.framescoop.app
        PRODUCT_NAME: FrameScoop
        INFOPLIST_FILE: FrameScoop/Info.plist
        CODE_SIGN_ENTITLEMENTS: FrameScoop/FrameScoop.entitlements
        # Hardened Runtime 关闭（仅影响 Xcode 本地构建；直发包由 package_dmg.sh
        # 以 Developer ID 重签时必然开启硬运行，公证的硬性要求）。
        #
        # 2026-09-16 更正：此处原注释写「Apple Development 证书 + HR 会让照片库 TCC
        # 静默拒绝（2026-09-02 探针实测）」—— 那个结论**归错了因**。真实原因是
        # entitlements 里缺 com.apple.security.personal-information.photos-library：
        # 硬运行要求资源访问必须由 entitlement 显式声明，缺失才导致 requestAuthorization
        # 静默返回 .denied。同一权限项在纯沙盒下不声明也能工作，所以那次探针只看到
        # 「开了 HR 就坏」这个规律，把 HR 当成了元凶，于是关掉 HR 绕过去 —— 而 1.0.9
        # 直发版首次启用公证（因而必然开 HR），这个被绕过的坑就暴露了。
        # 权限项已补齐，此处保留 NO 只是维持本地调试现状；如需让本地构建与发布配置
        # 一致（更容易提前发现此类差异），可改为 YES。
        ENABLE_HARDENED_RUNTIME: NO
        # 关闭 Xcode 15 Debug Dylib Support：自签名证书无 TeamIdentifier，
        # 拆出的 FrameScoop.debug.dylib 与主二进制 Team ID 不匹配，dyld library
        # validation 拒绝加载 -> dyld abort -> SIGABRT。关掉后 Debug 直接编进主二进制。
        ENABLE_DEBUG_DYLIB: NO
        # 用自签名证书 "FrameScoop Dev" 签名（稳定身份，DR 锚定证书而非 cdhash）
        # 代码改动重签后 TCC（照片库等）授权保持有效，Xcode 调试稳定
        CODE_SIGN_IDENTITY: "FrameScoop Dev"
        CODE_SIGN_STYLE: Manual
        # App 图标是手搓的 FrameScoop/Resources/AppIcon.icns
        # （由 Scripts/generate_icon.sh 从项目根 FC.png 生成各尺寸后 iconutil 打包），
        # Info.plist 只用 CFBundleIconFile 引用它。**故意不用资源目录，别改回去。**
        #
        # 为什么不用资源目录 AppIcon + CFBundleIconName —— 2026-09-26 实测教训：
        #   Apple 的 App Store 图标提取读的是 **bundle 里的 .icns**，不是 Assets.car。
        #   而 actool 从资源目录 AppIcon 导出的 .icns 是**残缺的**：只有
        #   ic04/ic07/ic11/ic13 四个块（最大 256px），ic05/ic08/ic09/ic10/ic12/ic14
        #   （含 512 与 1024）全部缺失 —— 尽管 Assets.car 里大图齐全。
        #   后果实测：1.0.10 的构建（手搓完整 .icns）iconAssetToken = 1024×1024；
        #   1.0.11 加入资源目录后 = **256×256**，商店页图标会发虚。
        #   （参考：本机 5 个规整的 MAS 应用确实都有 CFBundleIconName + 资源目录，
        #    但那只说明它们"有"该配置，不等于 Apple"靠"它取图。）
        #
        # 另外两点，避免重蹈：
        #   · 手搓 .icns 与 actool 会争抢 Contents/Resources/AppIcon.icns 同一路径，
        #     所以两者**不能并存**——并存时产出的字节随干净/增量构建而变
        #     （实测 137KB vs 1.9MB）。只用 .icns 时生产者唯一，构建可重复。
        #   · 此处原注释写「Info.plist 同时声明 CFBundleIconFile 和 CFBundleIconName」，
        #     那句话描述的修复**从未落地**（git log -S CFBundleIconName 可证该键从未
        #     出现过）。现已删除该说法——不是"忘记补"，而是实测证明补了有害。
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
        DEAD_CODE_STRIPPING: YES
        # 支持通用二进制（Apple Silicon + Intel）
        ARCHS: "$(ARCHS_STANDARD)"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

  FrameScoopTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: FrameScoopTests
    dependencies:
      - target: FrameScoop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.framescoop.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  FrameScoop:
    build:
      targets:
        FrameScoop: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FrameScoopTests

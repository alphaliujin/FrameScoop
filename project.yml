# XcodeGen 项目配置（运行 `xcodegen generate` 生成 FrameScoop.xcodeproj）
# 文档：https://github.com/yonaskolb/XcodeGen
name: FrameScoop
options:
  bundleIdPrefix: com.framescoop
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # 使用我们手写的 Info.plist，禁止 Xcode 自动生成
    GENERATE_INFOPLIST_FILE: NO
    DEVELOPMENT_TEAM: ""
    # Manual + 自签名证书：designated requirement 基于证书而非 cdhash，
    # 代码改动不再使 TCC（照片库等）授权失效，Xcode 调试也稳定。替代 ad-hoc。
    # 自签名证书不过期、不被撤销，比被撤销的 Apple Development 证书更可靠。
    CODE_SIGN_STYLE: Manual

targets:
  FrameScoop:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: FrameScoop
        excludes:
          - "Info.plist"
          - "FrameScoop.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.framescoop.app
        PRODUCT_NAME: FrameScoop
        INFOPLIST_FILE: FrameScoop/Info.plist
        CODE_SIGN_ENTITLEMENTS: FrameScoop/FrameScoop.entitlements
        # 启用 Hardened Runtime（公证必需）
        ENABLE_HARDENED_RUNTIME: YES
        # 关闭 Xcode 15 Debug Dylib Support：自签名证书无 TeamIdentifier，
        # 拆出的 FrameScoop.debug.dylib 与主二进制 Team ID 不匹配，dyld library
        # validation 拒绝加载 -> dyld abort -> SIGABRT。关掉后 Debug 直接编进主二进制。
        ENABLE_DEBUG_DYLIB: NO
        # 用自签名证书 "FrameScoop Dev" 签名（稳定身份，DR 锚定证书而非 cdhash）
        # 代码改动重签后 TCC（照片库等）授权保持有效，Xcode 调试稳定
        CODE_SIGN_IDENTITY: "FrameScoop Dev"
        CODE_SIGN_STYLE: Manual
        # App 图标通过 FrameScoop/Resources/AppIcon.icns 打包，由 CFBundleIconFile + CFBundleIconName 引用。
        # Info.plist 同时声明 CFBundleIconFile 和 CFBundleIconName（macOS 26 要求两者皆有，
        # 缺 CFBundleIconName 时系统回退为通用图标）。Assets.xcassets 中无 AppIcon.appiconset，
        # 故 ASSETCATALOG_COMPILER_APPICON_NAME 不会在 Assets.car 中生成图标，不影响 .icns 方案。
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
        DEAD_CODE_STRIPPING: YES
        # 支持通用二进制（Apple Silicon + Intel）
        ARCHS: "$(ARCHS_STANDARD)"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
